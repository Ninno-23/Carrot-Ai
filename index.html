<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f1219">
    <meta name="description" content="Carrot AI — study chat, documents, flashcards, quizzes, image generation, web search">
    <title>Carrot AI</title>
    <style>
        :root {
            --bg: #0f1219;
            --bg-elevated: #161b26;
            --panel: #1c2333;
            --panel-hover: #242c40;
            --border: #2d364a;
            --border-soft: #252d3f;
            --text: #eef1f8;
            --muted: #8b95ab;
            --orange: #ff8f45;
            --orange-hover: #ff7a22;
            --orange-soft: rgba(255, 143, 69, 0.15);
            --user-bg: #2a3550;
            --ai-bg: #171d2b;
            --danger: #ff6b7a;
            --ok: #3dd68c;
            --warn: #f5c542;
            --radius: 14px;
            --radius-sm: 10px;
            --shadow: 0 8px 28px rgba(0,0,0,0.35);
            --sidebar-w: 280px;
            --font: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; height: 100%; height: 100dvh;
            overflow: hidden;
            background: var(--bg); color: var(--text);
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
        }
        button, textarea, input { font: inherit; color: inherit; }
        button { cursor: pointer; border: none; background: none; }
        button:disabled { opacity: 0.55; cursor: not-allowed; }
        a { color: var(--orange); }

        .app {
            display: grid;
            grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
            height: 100%;
        }

        /* —— Sidebar —— */
        aside {
            display: flex; flex-direction: column; gap: 12px;
            padding: 18px 14px;
            background: linear-gradient(180deg, #12161f 0%, #0e121a 100%);
            border-right: 1px solid var(--border-soft);
            overflow: hidden;
        }
        .brand {
            display: flex; align-items: center; gap: 12px;
            padding: 4px 4px 8px;
        }
        .logo {
            display: grid; place-items: center;
            width: 44px; height: 44px; border-radius: 14px;
            background: linear-gradient(135deg, #ff9a4d, #ff6b2c);
            font-size: 1.5rem;
            box-shadow: 0 4px 16px rgba(255, 111, 44, 0.35);
        }
        .brand-text { display: flex; flex-direction: column; gap: 2px; }
        .brand-text strong { font-size: 1.15rem; letter-spacing: -0.02em; }
        .brand-text span { font-size: 0.72rem; color: var(--muted); }

        .btn-primary {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 12px 14px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--orange), #ff6b2c);
            color: #1a1008; font-weight: 700;
            box-shadow: 0 4px 14px rgba(255, 111, 44, 0.25);
            transition: transform 0.12s ease, filter 0.12s ease;
        }
        .btn-primary:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }
        .btn-primary:active:not(:disabled) { transform: translateY(0); }

        .side-label {
            color: var(--muted); font-size: 0.68rem;
            text-transform: uppercase; letter-spacing: 0.1em;
            font-weight: 600; margin: 6px 4px 2px;
        }

        .tools {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
        }
        .tool-btn {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            padding: 12px 8px;
            border-radius: var(--radius-sm);
            background: var(--panel);
            border: 1px solid var(--border-soft);
            color: var(--text);
            font-size: 0.78rem; font-weight: 600;
            transition: border-color 0.15s, background 0.15s, color 0.15s;
        }
        .tool-btn .ico { font-size: 1.15rem; line-height: 1; }
        .tool-btn:hover {
            border-color: var(--orange);
            background: var(--orange-soft);
            color: var(--orange);
        }

        #history {
            display: flex; flex-direction: column; gap: 4px;
            overflow-y: auto; flex: 1; min-height: 0;
            padding-right: 2px;
        }
        .history-item {
            text-align: left; padding: 10px 12px;
            border-radius: 9px;
            color: var(--muted);
            font-size: 0.85rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: background 0.12s, color 0.12s;
        }
        .history-item:hover { background: var(--panel); color: var(--text); }
        .history-item.active {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .side-footer {
            display: flex; flex-direction: column; gap: 8px;
            padding-top: 8px; border-top: 1px solid var(--border-soft);
        }
        .status {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.75rem; color: var(--muted);
            padding: 4px 2px;
        }
        .status .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--muted); flex-shrink: 0;
        }
        .status.ok .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
        .status.warn .dot { background: var(--warn); }
        .status.err .dot { background: var(--danger); }

        .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip {
            font-size: 0.68rem; padding: 4px 8px;
            border-radius: 999px;
            background: var(--panel);
            border: 1px solid var(--border-soft);
            color: var(--muted);
        }
        .chip.on { color: var(--ok); border-color: rgba(61,214,140,0.35); }

        /* —— Main —— */
        main {
            display: flex; flex-direction: column;
            min-width: 0; height: 100%;
            background: var(--bg);
        }
        .topbar {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 18px;
            border-bottom: 1px solid var(--border-soft);
            background: rgba(15, 18, 25, 0.85);
            backdrop-filter: blur(10px);
        }
        .menu-toggle {
            display: none;
            padding: 8px 12px;
            border-radius: 9px;
            background: var(--panel);
            border: 1px solid var(--border);
            font-size: 1.1rem;
        }
        .topbar-title {
            flex: 1; font-weight: 650; font-size: 0.95rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .top-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .icon-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 12px;
            border-radius: 9px;
            background: var(--panel);
            border: 1px solid var(--border-soft);
            color: var(--muted);
            font-size: 0.8rem; font-weight: 600;
            transition: color 0.12s, border-color 0.12s, background 0.12s;
        }
        .icon-btn:hover {
            color: var(--text);
            border-color: var(--orange);
            background: var(--orange-soft);
        }

        /* Search panel */
        .search-panel {
            display: none;
            padding: 12px 18px 14px;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border-soft);
        }
        .search-panel.open { display: block; }
        .search-row {
            display: flex; gap: 8px;
            max-width: 820px; margin: 0 auto;
        }
        .search-row input {
            flex: 1; padding: 11px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--panel);
            outline: none;
        }
        .search-row input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-soft); }
        .search-results {
            max-width: 820px; margin: 12px auto 0;
            font-size: 0.85rem; color: var(--muted);
        }
        .search-results .hit {
            padding: 10px 0;
            border-bottom: 1px solid var(--border-soft);
        }
        .search-results .hit strong { color: var(--text); }
        .search-results .summary {
            white-space: pre-wrap;
            color: var(--text);
            background: var(--panel);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        /* Messages */
        #messages {
            flex: 1; overflow-y: auto;
            padding: 24px 18px;
            display: flex; flex-direction: column; gap: 16px;
            scroll-behavior: smooth;
        }
        .message {
            max-width: min(740px, 100%);
            padding: 14px 16px;
            border-radius: var(--radius);
            line-height: 1.55;
            word-break: break-word;
            position: relative;
            animation: fadeUp 0.22s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: none; }
        }
        .message.user {
            align-self: flex-end;
            background: linear-gradient(145deg, #2f3b58, #273249);
            border: 1px solid #3a4663;
            border-bottom-right-radius: 4px;
        }
        .message.ai {
            align-self: flex-start;
            background: var(--ai-bg);
            border: 1px solid var(--border-soft);
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow);
        }
        .message.error-msg {
            border-color: rgba(255, 107, 122, 0.4);
            background: rgba(255, 107, 122, 0.08);
        }
        .message-label {
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px;
            font-size: 0.72rem; color: var(--muted);
            margin-bottom: 6px; font-weight: 650;
        }
        .message-body {
            white-space: pre-wrap;
            font-size: 0.95rem;
        }
        .message-body code {
            background: rgba(255,255,255,0.06);
            padding: 1px 5px; border-radius: 4px;
            font-size: 0.88em;
        }
        .msg-actions {
            display: flex; gap: 6px; margin-top: 10px;
            opacity: 0.7;
        }
        .msg-actions button {
            font-size: 0.72rem;
            padding: 4px 8px;
            border-radius: 6px;
            background: var(--panel);
            border: 1px solid var(--border-soft);
            color: var(--muted);
        }
        .msg-actions button:hover { color: var(--text); border-color: var(--orange); }
        .message img.gen {
            max-width: min(100%, 420px);
            border-radius: 12px;
            margin-top: 10px;
            display: block;
            border: 1px solid var(--border);
        }
        .message .dl {
            display: inline-flex; align-items: center; gap: 4px;
            margin-top: 8px;
            font-size: 0.82rem; font-weight: 600;
            color: var(--orange); text-decoration: none;
        }
        .message .dl:hover { text-decoration: underline; }

        /* Welcome */
        .welcome {
            max-width: 560px; margin: 48px auto; text-align: center;
            color: var(--muted);
            animation: fadeUp 0.3s ease;
        }
        .welcome .hero-logo {
            font-size: 3rem; margin-bottom: 8px;
            filter: drop-shadow(0 8px 20px rgba(255,143,69,0.35));
        }
        .welcome h1 {
            color: var(--text); font-size: 1.75rem;
            margin: 0 0 8px; letter-spacing: -0.03em;
        }
        .welcome p { margin: 0 0 8px; line-height: 1.5; }
        .feature-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 20px 0 8px;
            text-align: left;
        }
        .feature-grid div {
            background: var(--panel);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            font-size: 0.8rem;
            color: var(--text);
        }
        .prompts {
            display: flex; flex-wrap: wrap; gap: 8px;
            justify-content: center; margin-top: 18px;
        }
        .prompts button {
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 999px;
            padding: 9px 14px;
            font-size: 0.82rem;
            transition: border-color 0.12s, background 0.12s;
        }
        .prompts button:hover {
            border-color: var(--orange);
            background: var(--orange-soft);
        }

        /* Composer */
        .composer {
            padding: 12px 16px 18px;
            border-top: 1px solid var(--border-soft);
            background: linear-gradient(180deg, transparent, rgba(15,18,25,0.95));
        }
        .composer-inner { max-width: 820px; margin: 0 auto; }
        .composer-row {
            display: flex; gap: 10px; align-items: flex-end;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px 8px 8px 14px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .composer-row:focus-within {
            border-color: var(--orange);
            box-shadow: 0 0 0 3px var(--orange-soft);
        }
        #input {
            flex: 1; min-height: 44px; max-height: 160px;
            resize: none; padding: 10px 4px;
            border: none; background: transparent;
            color: var(--text); outline: none;
            line-height: 1.4;
        }
        .send-btn {
            flex-shrink: 0;
            width: 44px; height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--orange), #ff6b2c);
            color: #1a1008;
            font-weight: 800; font-size: 1.1rem;
            display: grid; place-items: center;
            transition: filter 0.12s, transform 0.12s;
        }
        .send-btn:hover:not(:disabled) { filter: brightness(1.08); }
        .send-btn:disabled { filter: grayscale(0.4); }

        .composer-actions {
            display: flex; flex-wrap: wrap; gap: 8px;
            align-items: center;
            margin-top: 10px;
            padding: 0 4px;
        }
        .file-label, .action-btn {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--panel);
            border: 1px solid var(--border-soft);
            color: var(--muted);
            border-radius: 9px;
            padding: 7px 11px;
            font-size: 0.78rem; font-weight: 600;
            transition: color 0.12s, border-color 0.12s;
        }
        .file-label:hover, .action-btn:hover {
            color: var(--text);
            border-color: var(--orange);
        }
        #file-name {
            color: var(--muted); font-size: 0.72rem;
            max-width: 160px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        .ctx-badge {
            display: none;
            font-size: 0.72rem;
            padding: 5px 10px;
            border-radius: 999px;
            background: var(--orange-soft);
            color: var(--orange);
            border: 1px solid rgba(255,143,69,0.35);
            font-weight: 600;
        }
        .ctx-badge.show { display: inline-flex; align-items: center; gap: 4px; }

        .typing {
            display: inline-flex; gap: 4px; padding: 4px 0;
        }
        .typing span {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--muted);
            animation: bounce 1.2s infinite ease-in-out;
        }
        .typing span:nth-child(2) { animation-delay: 0.15s; }
        .typing span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-5px); opacity: 1; }
        }

        .overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.5); z-index: 40;
        }
        .overlay.open { display: block; }

        @media (max-width: 800px) {
            .app { grid-template-columns: 1fr; }
            aside {
                position: fixed; left: 0; top: 0; bottom: 0;
                width: min(88vw, 300px); z-index: 50;
                transform: translateX(-105%);
                transition: transform 0.22s ease;
                box-shadow: var(--shadow);
            }
            aside.open { transform: translateX(0); }
            .menu-toggle { display: inline-flex; }
            .message { max-width: 100%; }
            .feature-grid { grid-template-columns: 1fr; }
            .top-actions .label { display: none; }
        }
    </style>
</head>
<body>
<div class="overlay" id="overlay" aria-hidden="true"></div>
<div class="app">
    <aside id="sidebar">
        <div class="brand">
            <div class="logo" aria-hidden="true">🥕</div>
            <div class="brand-text">
                <strong>Carrot AI</strong>
                <span>Study · Code · Create</span>
            </div>
        </div>
        <button type="button" class="btn-primary" id="new-chat">＋ New chat</button>

        <div class="side-label">Study tools</div>
        <div class="tools">
            <button type="button" class="tool-btn" data-study="summary" title="Summarize document or text">
                <span class="ico">📝</span> Summary
            </button>
            <button type="button" class="tool-btn" data-study="reviewer" title="Key concepts reviewer">
                <span class="ico">📖</span> Reviewer
            </button>
            <button type="button" class="tool-btn" data-study="flashcards" title="Generate flashcards">
                <span class="ico">🃏</span> Cards
            </button>
            <button type="button" class="tool-btn" data-study="quiz" title="Generate a quiz">
                <span class="ico">✅</span> Quiz
            </button>
        </div>

        <div class="side-label">History</div>
        <div id="history" role="list"></div>

        <div class="side-footer">
            <div class="chip-row" id="caps">
                <span class="chip" id="cap-chat">Chat</span>
                <span class="chip" id="cap-img">Images</span>
                <span class="chip" id="cap-search">Search</span>
            </div>
            <div class="status" id="status"><span class="dot"></span> Checking…</div>
        </div>
    </aside>

    <main>
        <div class="topbar">
            <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Open menu">☰</button>
            <div class="topbar-title" id="chat-title">Chat</div>
            <div class="top-actions">
                <button type="button" class="icon-btn" id="toggle-search" title="Web search">
                    🔍 <span class="label">Search</span>
                </button>
                <button type="button" class="icon-btn" id="clear-history" title="Clear all chats">
                    🗑️ <span class="label">Clear</span>
                </button>
            </div>
        </div>

        <div class="search-panel" id="search-panel">
            <div class="search-row">
                <input type="search" id="search-q" placeholder="Search the web for research…" autocomplete="off" />
                <button type="button" class="btn-primary" id="search-go" style="width:auto;padding:10px 16px;">Go</button>
            </div>
            <div class="search-results" id="search-results"></div>
        </div>

        <div id="messages" role="log" aria-live="polite"></div>

        <div class="composer">
            <div class="composer-inner">
                <div class="composer-row">
                    <textarea id="input" rows="1" placeholder="Message Carrot AI… (Shift+Enter for new line)"></textarea>
                    <button type="button" class="send-btn" id="send" title="Send" aria-label="Send">↑</button>
                </div>
                <div class="composer-actions">
                    <label class="file-label" title="PDF, Word, TXT, MD">
                        📎 Attach
                        <input type="file" id="file" accept=".pdf,.docx,.txt,.md,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/markdown" hidden />
                    </label>
                    <span id="file-name"></span>
                    <button type="button" class="action-btn" id="analyze-doc">📚 Analyze</button>
                    <button type="button" class="action-btn" id="gen-image">🎨 Image</button>
                    <span class="ctx-badge" id="ctx-badge">📄 Context on</span>
                    <button type="button" class="action-btn" id="clear-ctx" title="Clear document context">Clear ctx</button>
                </div>
            </div>
        </div>
    </main>
</div>

<template id="welcome-tpl">
    <div class="welcome">
        <div class="hero-logo">🥕</div>
        <h1>Carrot AI</h1>
        <p>Chat, study from PDFs &amp; Word docs, flashcards, quizzes, images, and web search — all in one place.</p>
        <div class="feature-grid">
            <div>🧠 AI chat &amp; coding help</div>
            <div>📚 PDF / Word analysis</div>
            <div>🎓 Reviewers &amp; flashcards</div>
            <div>🎨 Image generation</div>
            <div>🌐 Web search + sources</div>
            <div>💾 Conversation history</div>
        </div>
        <div class="prompts">
            <button type="button" data-prompt="Explain recursion with a short Python example">Explain recursion</button>
            <button type="button" data-prompt="Make a 5-day study plan for calculus">Study plan</button>
            <button type="button" data-prompt="What is photosynthesis in simple terms?">Photosynthesis</button>
            <button type="button" data-prompt="Write a short README for a Flask app">Write a README</button>
        </div>
    </div>
</template>

<script>
(function () {
    "use strict";

    const $ = (id) => document.getElementById(id);
    const STORAGE_KEY = "carrot_chats_v3";
    let chats = [];
    let currentId = null;
    let busy = false;
    let docContext = "";
    let docName = "";

    function uid() {
        return "c_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function safeJson(res) {
        return res.json().catch(function () {
            var msg = "Server returned an invalid response (" + res.status + ").";
            if (res.status === 405) {
                msg = "Server blocked this request (405 Method Not Allowed). "
                    + "On Render: use a Web Service (not Static), start command "
                    + "gunicorn app:app --bind 0.0.0.0:$PORT, and redeploy.";
            } else if (res.status === 502 || res.status === 503) {
                msg = "Server is waking up or AI is not configured (" + res.status + "). Wait a few seconds or check Render env vars.";
            } else if (res.status === 0) {
                msg = "Network error — check your connection.";
            }
            return { error: msg };
        });
    }

    function load() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                const data = JSON.parse(raw);
                chats = Array.isArray(data.chats) ? data.chats : [];
                currentId = data.currentId || (chats[0] && chats[0].id) || null;
            }
        } catch (_) {
            chats = [];
        }
        if (!chats.length) newChat(false);
    }

    function save() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ chats: chats, currentId: currentId }));
        } catch (_) { /* quota or private mode */ }
    }

    function currentChat() {
        return chats.find(function (c) { return c.id === currentId; }) || null;
    }

    function newChat(renderNow) {
        if (renderNow === undefined) renderNow = true;
        const chat = { id: uid(), title: "New chat", messages: [] };
        chats.unshift(chat);
        if (chats.length > 40) chats = chats.slice(0, 40);
        currentId = chat.id;
        save();
        if (renderNow) render();
    }

    function updateCtxBadge() {
        const badge = $("ctx-badge");
        if (docContext) {
            badge.classList.add("show");
            badge.textContent = "📄 " + (docName || "Document") + " loaded";
        } else {
            badge.classList.remove("show");
        }
    }

    function formatBody(text) {
        // Light, safe formatting: escape HTML then highlight `code`
        const div = document.createElement("div");
        div.textContent = String(text || "");
        let html = div.innerHTML;
        html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
        return html;
    }

    function addMessage(role, content, extra) {
        const box = document.createElement("div");
        const isError = role === "assistant" && String(content || "").indexOf("⚠️") === 0;
        box.className = "message " + (role === "user" ? "user" : "ai") + (isError ? " error-msg" : "");

        if (role !== "user") {
            const label = document.createElement("div");
            label.className = "message-label";
            const left = document.createElement("span");
            left.textContent = "🥕 Carrot AI";
            label.appendChild(left);
            box.appendChild(label);
        }

        const body = document.createElement("div");
        body.className = "message-body";
        body.innerHTML = formatBody(content);
        box.appendChild(body);

        if (extra && extra.image_b64) {
            const img = document.createElement("img");
            img.className = "gen";
            img.alt = extra.prompt || "Generated image";
            img.src = "data:" + (extra.mime || "image/png") + ";base64," + extra.image_b64;
            box.appendChild(img);
            const a = document.createElement("a");
            a.className = "dl";
            a.href = img.src;
            a.download = "carrot-image.png";
            a.textContent = "⬇ Download image";
            box.appendChild(a);
        } else if (extra && extra.image_url) {
            const img = document.createElement("img");
            img.className = "gen";
            img.alt = extra.prompt || "Generated image";
            img.src = extra.image_url;
            box.appendChild(img);
            const a = document.createElement("a");
            a.className = "dl";
            a.href = extra.image_url;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = "↗ Open image";
            box.appendChild(a);
        }

        if (role !== "user" && content) {
            const actions = document.createElement("div");
            actions.className = "msg-actions";
            const copyBtn = document.createElement("button");
            copyBtn.type = "button";
            copyBtn.textContent = "Copy";
            copyBtn.addEventListener("click", function () {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(String(content)).then(function () {
                        copyBtn.textContent = "Copied";
                        setTimeout(function () { copyBtn.textContent = "Copy"; }, 1200);
                    }).catch(function () {
                        copyBtn.textContent = "Failed";
                        setTimeout(function () { copyBtn.textContent = "Copy"; }, 1200);
                    });
                }
            });
            actions.appendChild(copyBtn);
            box.appendChild(actions);
        }

        $("messages").appendChild(box);
        $("messages").scrollTop = $("messages").scrollHeight;
        return box;
    }

    function showTyping() {
        const box = document.createElement("div");
        box.className = "message ai";
        box.id = "typing-indicator";
        const label = document.createElement("div");
        label.className = "message-label";
        label.textContent = "🥕 Carrot AI";
        box.appendChild(label);
        const t = document.createElement("div");
        t.className = "typing";
        t.innerHTML = "<span></span><span></span><span></span>";
        box.appendChild(t);
        $("messages").appendChild(box);
        $("messages").scrollTop = $("messages").scrollHeight;
    }

    function hideTyping() {
        const el = $("typing-indicator");
        if (el) el.remove();
    }

    function renderHistory() {
        const el = $("history");
        el.replaceChildren();
        chats.forEach(function (chat) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "history-item" + (chat.id === currentId ? " active" : "");
            btn.textContent = chat.title || "Chat";
            btn.setAttribute("role", "listitem");
            btn.addEventListener("click", function () {
                currentId = chat.id;
                save();
                render();
                closeSidebar();
            });
            el.appendChild(btn);
        });
    }

    function render() {
        const conv = $("messages");
        conv.replaceChildren();
        const chat = currentChat();
        $("chat-title").textContent = (chat && chat.title) || "Chat";
        if (!chat || !chat.messages.length) {
            const tpl = $("welcome-tpl").content.cloneNode(true);
            conv.appendChild(tpl);
            conv.querySelectorAll("[data-prompt]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    $("input").value = btn.getAttribute("data-prompt") || "";
                    $("input").focus();
                });
            });
        } else {
            chat.messages.forEach(function (m) {
                addMessage(m.role, m.content, m.extra);
            });
        }
        renderHistory();
        updateCtxBadge();
    }

    function setBusy(v) {
        busy = !!v;
        $("send").disabled = busy;
        $("analyze-doc").disabled = busy;
        $("gen-image").disabled = busy;
        document.querySelectorAll("[data-study]").forEach(function (b) { b.disabled = busy; });
    }

    async function checkHealth() {
        const st = $("status");
        try {
            const r = await fetch("/api/health");
            const data = await safeJson(r);
            if (!r.ok) throw new Error("bad status");
            st.className = "status";
            if (data.ai_configured) {
                st.classList.add("ok");
                st.innerHTML = '<span class="dot"></span> AI online' +
                    (data.image_generation_configured ? " · images ready" : " · add HF_TOKEN for images");
            } else {
                st.classList.add("warn");
                st.innerHTML = '<span class="dot"></span> Server online · set AI keys on Render';
            }
            toggleCap("cap-chat", !!data.ai_configured);
            toggleCap("cap-img", !!data.image_generation_configured);
            toggleCap("cap-search", !!data.web_search_available);
        } catch (_) {
            st.className = "status err";
            st.innerHTML = '<span class="dot"></span> Server unavailable';
        }
    }

    function toggleCap(id, on) {
        const el = $(id);
        if (!el) return;
        if (on) el.classList.add("on");
        else el.classList.remove("on");
    }

    async function sendMessage(text) {
        if (busy || !String(text || "").trim()) return;
        if (!currentChat()) newChat(false);
        const chat = currentChat();
        const history = chat.messages
            .filter(function (m) { return m.role === "user" || m.role === "assistant"; })
            .map(function (m) { return { role: m.role, content: m.content }; })
            .slice(-20);

        chat.messages.push({ role: "user", content: text });
        if (chat.title === "New chat") {
            chat.title = text.slice(0, 42) + (text.length > 42 ? "…" : "");
        }
        save();
        render();
        setBusy(true);
        showTyping();

        try {
            const body = { message: text, history: history };
            if (docContext) body.context = docContext;
            const r = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
            });
            const data = await safeJson(r);
            hideTyping();
            if (!r.ok) throw new Error(data.error || "Chat failed");
            chat.messages.push({ role: "assistant", content: data.answer });
            save();
            render();
        } catch (err) {
            hideTyping();
            chat.messages.push({
                role: "assistant",
                content: "⚠️ " + (err.message || "Something went wrong. Check your AI keys and try again."),
            });
            save();
            render();
        } finally {
            setBusy(false);
        }
    }

    async function runStudy(kind) {
        if (busy) return;
        let text = docContext;
        const file = $("file").files[0];
        setBusy(true);
        if (!currentChat()) newChat(false);
        const chat = currentChat();
        chat.messages.push({
            role: "user",
            content: "Study tool: " + kind + (docName ? " (" + docName + ")" : ""),
        });
        save();
        render();
        showTyping();

        try {
            let r;
            if (file && !text) {
                const fd = new FormData();
                fd.append("file", file);
                r = await fetch("/api/study/" + encodeURIComponent(kind), { method: "POST", body: fd });
            } else {
                if (!text) {
                    const typed = ($("input").value || "").trim();
                    if (typed.length > 80) text = typed;
                }
                if (!text) throw new Error("Upload a document or paste source text first, then use Summary / Cards / Quiz.");
                r = await fetch("/api/study/" + encodeURIComponent(kind), {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: text }),
                });
            }
            const data = await safeJson(r);
            hideTyping();
            if (!r.ok) throw new Error(data.error || "Study tool failed");
            chat.messages.push({ role: "assistant", content: data.answer });
            if (chat.title === "New chat") chat.title = kind + " notes";
            save();
            render();
        } catch (err) {
            hideTyping();
            chat.messages.push({
                role: "assistant",
                content: "⚠️ " + (err.message || "Study tool failed"),
            });
            save();
            render();
        } finally {
            setBusy(false);
        }
    }

    async function analyzeDoc() {
        const file = $("file").files[0];
        if (!file) {
            addMessage("ai", "⚠️ Choose a PDF, DOCX, TXT, or MD file first (📎 Attach).");
            return;
        }
        if (busy) return;
        setBusy(true);
        showTyping();
        try {
            const fd = new FormData();
            fd.append("file", file);
            const r = await fetch("/api/document", { method: "POST", body: fd });
            const data = await safeJson(r);
            hideTyping();
            if (!r.ok) throw new Error(data.error || "Upload failed");
            docContext = data.text || "";
            docName = data.filename || file.name;
            $("file-name").textContent = docName;
            updateCtxBadge();
            if (!currentChat()) newChat(false);
            const chat = currentChat();
            chat.messages.push({
                role: "assistant",
                content:
                    "Document loaded: " + docName + "\n" +
                    (data.chars || 0) + " characters extracted.\n\nPreview:\n" +
                    ((data.preview || "").slice(0, 400)) +
                    ((data.chars || 0) > 400 ? "…" : "") +
                    "\n\nYou can chat about it or use Summary / Cards / Quiz.",
            });
            save();
            render();
        } catch (err) {
            hideTyping();
            addMessage("ai", "⚠️ " + (err.message || "Document failed"));
        } finally {
            setBusy(false);
        }
    }

    async function genImage() {
        const prompt = ($("input").value || "").trim();
        if (!prompt) {
            addMessage("ai", "⚠️ Type an image prompt in the box, then press 🎨 Image.");
            return;
        }
        if (busy) return;
        setBusy(true);
        if (!currentChat()) newChat(false);
        const chat = currentChat();
        chat.messages.push({ role: "user", content: "Generate image: " + prompt });
        save();
        render();
        showTyping();
        try {
            const r = await fetch("/api/image", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prompt: prompt }),
            });
            const data = await safeJson(r);
            hideTyping();
            if (!r.ok) throw new Error(data.error || "Image failed");
            const extra = {
                image_b64: data.image_b64,
                image_url: data.image_url,
                mime: data.mime,
                prompt: prompt,
            };
            chat.messages.push({
                role: "assistant",
                content: "Generated image for: " + prompt,
                extra: extra,
            });
            $("input").value = "";
            save();
            render();
        } catch (err) {
            hideTyping();
            chat.messages.push({
                role: "assistant",
                content: "⚠️ " + (err.message || "Image generation failed"),
            });
            save();
            render();
        } finally {
            setBusy(false);
        }
    }

    async function doSearch() {
        const q = ($("search-q").value || "").trim();
        if (!q) return;
        $("search-results").textContent = "Searching…";
        try {
            const r = await fetch("/api/search", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query: q, summarize: true }),
            });
            const data = await safeJson(r);
            if (!r.ok) throw new Error(data.error || "Search failed");
            const box = $("search-results");
            box.replaceChildren();
            if (data.summary) {
                const s = document.createElement("div");
                s.className = "summary";
                s.textContent = data.summary;
                box.appendChild(s);
            }
            (data.results || []).forEach(function (hit, i) {
                const d = document.createElement("div");
                d.className = "hit";
                const title = document.createElement("strong");
                title.textContent = "[" + (i + 1) + "] " + (hit.title || "");
                d.appendChild(title);
                d.appendChild(document.createElement("br"));
                if (hit.url) {
                    const a = document.createElement("a");
                    a.href = hit.url;
                    a.target = "_blank";
                    a.rel = "noopener noreferrer";
                    a.textContent = hit.url;
                    d.appendChild(a);
                    d.appendChild(document.createElement("br"));
                }
                const sn = document.createElement("span");
                sn.textContent = hit.snippet || "";
                d.appendChild(sn);
                box.appendChild(d);
            });
            if (!data.results || !data.results.length) {
                box.textContent = "No results.";
            }
        } catch (err) {
            $("search-results").textContent = err.message || "Search failed";
        }
    }

    function closeSidebar() {
        $("sidebar").classList.remove("open");
        $("overlay").classList.remove("open");
    }

    // Events
    $("new-chat").addEventListener("click", function () {
        newChat();
        closeSidebar();
    });
    $("send").addEventListener("click", function () {
        const t = $("input").value.trim();
        $("input").value = "";
        sendMessage(t);
    });
    $("input").addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            $("send").click();
        }
    });
    $("input").addEventListener("input", function () {
        this.style.height = "auto";
        this.style.height = Math.min(this.scrollHeight, 160) + "px";
    });
    $("file").addEventListener("change", function () {
        const f = $("file").files[0];
        $("file-name").textContent = f ? f.name : "";
    });
    $("analyze-doc").addEventListener("click", analyzeDoc);
    $("gen-image").addEventListener("click", genImage);
    $("clear-ctx").addEventListener("click", function () {
        docContext = "";
        docName = "";
        $("file-name").textContent = "";
        $("file").value = "";
        updateCtxBadge();
        addMessage("ai", "Document context cleared.");
    });
    $("clear-history").addEventListener("click", function () {
        if (!confirm("Clear all chat history on this device?")) return;
        chats = [];
        currentId = null;
        newChat();
    });
    document.querySelectorAll("[data-study]").forEach(function (btn) {
        btn.addEventListener("click", function () {
            runStudy(btn.getAttribute("data-study"));
            closeSidebar();
        });
    });
    $("toggle-search").addEventListener("click", function () {
        $("search-panel").classList.toggle("open");
        if ($("search-panel").classList.contains("open")) $("search-q").focus();
    });
    $("search-go").addEventListener("click", doSearch);
    $("search-q").addEventListener("keydown", function (e) {
        if (e.key === "Enter") doSearch();
    });
    $("menu-toggle").addEventListener("click", function () {
        $("sidebar").classList.toggle("open");
        $("overlay").classList.toggle("open");
    });
    $("overlay").addEventListener("click", closeSidebar);

    // Global error safety — never leave UI broken
    window.addEventListener("error", function () {
        setBusy(false);
        hideTyping();
    });
    window.addEventListener("unhandledrejection", function () {
        setBusy(false);
        hideTyping();
    });

    load();
    render();
    checkHealth();
})();
</script>
</body>
</html>
