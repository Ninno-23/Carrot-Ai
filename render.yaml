services:
  - type: web
    name: carrot-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: AI_API_URL
        value: https://router.huggingface.co/v1/chat/completions
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: Qwen/Qwen2.5-7B-Instruct
      - key: HF_TOKEN
        sync: false
      - key: IMAGE_MODEL
        value: black-forest-labs/FLUX.1-schnell
      - key: IMAGE_API_URL
        sync: false
      - key: IMAGE_API_KEY
        sync: false
