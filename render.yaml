services:
  - type: web
    name: carrot-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 240 --access-logfile - --error-logfile -
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: AI_API_URL
        value: https://router.huggingface.co/v1/chat/completions
      - key: AI_MODEL
        value: openai/gpt-oss-120b:fastest
      - key: IMAGE_MODEL
        value: black-forest-labs/FLUX.1-dev
      - key: AI_API_KEY
        sync: false
      - key: IMAGE_API_KEY
        sync: false
